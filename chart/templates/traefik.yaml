{{- $relname := .Release.Name -}}
{{- range .Values.challengeNamespaces }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  namespace: {{ $relname }}-{{ . }}
spec:
  headers:
    stsSeconds: 15552000
    forceSTSHeader: true
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: {{ $relname }}-{{ . }}
spec:
  rateLimit:
    average: 50
    burst: 100
  sourceCriterion:
    ipStrategy:
      ipv6Subnet: 56
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  namespace: {{ .Release.Name }}-management
spec:
  headers:
    stsSeconds: 15552000
    forceSTSHeader: true
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik
  labels:
    app.kubernetes.io/name: kube-ctf
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  defaultCertificate:
    secretName: {{ .Release.Name }}-cert-challenges