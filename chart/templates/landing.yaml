
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: {{ .Release.Name }}-challenges
  labels:
    role: landing
spec:
  replicas: {{ (index  .Values "landing").replicas }}
  selector:
    matchLabels:
      role: landing
  template:
    metadata:
      labels:
        role: landing
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: web
        image: {{ .Values.registries.infra }}/services/landing:latest
        resources:
{{ toYaml (index  .Values "landing").quota | indent 10 }}
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: {{ .Release.Name }}-challenges
  labels:
    role: landing
spec:
  selector:
    role: landing
  ports:
    - port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: landing-https
  namespace: {{ .Release.Name }}-challenges
spec:
  entryPoints:
    - websecure
  tls:
    store:
      name: {{ .Release.Name }}-cert-challenges
  routes:
    - match: HostRegexp(`{{ .Values.domain.challenges }}`, `{subdomain:[\w-]+}.{{ .Values.domain.challenges }}`)
      kind: Rule
      priority: 1
      services:
      - name: landing
        port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: landing-http
  namespace: {{ .Release.Name }}-challenges
spec:
  entryPoints:
    - web
  routes:
    - match: HostRegexp(`{{ .Values.domain.challenges }}`, `{subdomain:[\w-]+}.{{ .Values.domain.challenges }}`)
      kind: Rule
      priority: 1
      services:
      - name: landing
        port: 80